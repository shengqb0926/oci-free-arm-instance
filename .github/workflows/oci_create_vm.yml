name: Try to Create OCI VM

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  create-instance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install and Configure OCI CLI
        run: |
          # 1. 安装官方 OCI CLI 工具
          bash -c "$(curl -L https://githubusercontent.com) --accept-all-defaults"
          
          # 2. 将 OCI 添加到系统环境变量路径中
          echo "/home/runner/bin" >> $GITHUB_PATH
          export PATH=$PATH:/home/runner/bin
          
          # 3. 创建 OCI 密钥目录
          mkdir -p ~/.oci
          
          # 4. 写入私钥内容
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          
          # 5. 自动生成并写入 OCI 配置文件
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_CLI_USER }}
          fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_CLI_TENANCY }}
          region=${{ secrets.OCI_CLI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Send Create Instance Command to OCI
        id: create-vm
        continue-on-error: true
        run: |
          # 1. 生成临时的 SSH 公钥文件
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/ssh_key.pub
          
          # 2. 执行原始 OCI 创建命令
          /home/runner/bin/oci compute instance launch \
            --availability-domain "${{ secrets.AD_NAME }}" \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus": 2, "memoryInGBs": 12}' \
            --image-id "${{ secrets.IMAGE_ID }}" \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --assign-public-ip true \
            --display-name "coolify-vm" \
            --boot-volume-size-in-gbs 100 \
            --ssh-authorized-keys-file /tmp/ssh_key.pub

      - name: Send Status Notification to Discord
        run: |
          if [ "${{ steps.create-vm.outcome }}" = "success" ]; then
            MESSAGE="🟢 【成功】实例创建成功！"
          else
            MESSAGE="🔴 【失败】容量不足，将自动重试。"
          fi
          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"${MESSAGE}\"}" "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Check Final Status
        run: |
          if [ "${{ steps.create-vm.outcome }}" != "success" ]; then exit 1; fi
